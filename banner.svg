<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Hello, I'm Ahmed! Flutter Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B0B"/>
      <stop offset="1" stop-color="#1A0D0D"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4AF37"/>
      <stop offset="0.5" stop-color="#F2D26B"/>
      <stop offset="1" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>
  <style>
    .dot-r { fill: #C1121F; opacity: .45; }
    .dot-g { fill: #D4AF37; opacity: .4; }
    .d1 { animation: float1 6s ease-in-out infinite; }
    .d2 { animation: float2 7s ease-in-out infinite; }
    .d3 { animation: float1 8s ease-in-out infinite reverse; }
    @keyframes float1 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-22px); } }
    @keyframes float2 { 0%,100% { transform: translateX(0); } 50% { transform: translateX(18px); } }

    text { font-family: Poppins, 'Segoe UI', Roboto, Arial, sans-serif; text-anchor: middle; }
    .white { fill: #F5F5F5; }
    .gold { fill: #D4AF37; }
    .red { fill: #E63946; font-weight: 600; }
    .l1 { animation: in1 9s ease-in-out infinite; }
    .l2 { animation: in2 9s ease-in-out infinite; }
    .l3 { animation: in3 9s ease-in-out infinite; }
    .bar { animation: grow 9s ease-in-out infinite; transform-origin: 600px 340px; }

    @keyframes in1 {
      0%   { opacity: 0; transform: translateY(26px); }
      8%, 88% { opacity: 1; transform: translateY(0); }
      96%, 100% { opacity: 0; transform: translateY(-12px); }
    }
    @keyframes in2 {
      0%, 10% { opacity: 0; transform: translateY(26px); }
      18%, 88% { opacity: 1; transform: translateY(0); }
      96%, 100% { opacity: 0; transform: translateY(-12px); }
    }
    @keyframes in3 {
      0%, 20% { opacity: 0; transform: translateY(26px); }
      28%, 88% { opacity: 1; transform: translateY(0); }
      96%, 100% { opacity: 0; transform: translateY(-12px); }
    }
    @keyframes grow {
      0%, 28% { transform: scaleX(0); }
      42%, 88% { transform: scaleX(1); }
      96%, 100% { transform: scaleX(0); }
    }
  </style>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <circle class="dot-r d1" cx="120" cy="90" r="46"/>
  <circle class="dot-g d2" cx="1080" cy="310" r="62"/>
  <circle class="dot-r d3" cx="1020" cy="70" r="28"/>
  <circle class="dot-g d2" cx="170" cy="320" r="30"/>

  <text class="l1 white" x="600" y="170" font-size="76" font-weight="500">Hello, I'm <tspan class="red">Ahmed</tspan>!</text>
  <text class="l2 gold" x="600" y="224" font-size="28">Software Engineer, Flutter Developer 📱</text>
  <text class="l3 white" x="600" y="300" font-size="32">Flutter <tspan class="red">|</tspan> Dart <tspan class="red">|</tspan> Clean Architecture <tspan class="red">|</tspan> BLoC</text>
  <rect class="bar" x="440" y="338" width="320" height="5" rx="2.5" fill="url(#line)"/>
</svg>
